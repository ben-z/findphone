name: CI

on:
  push:
    branches: [main, feat/stable-survey-labels]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test session labels
        run: |
          swiftc Sources/findphone/SessionLabels.swift \
            Tests/SessionLabelsTests/main.swift \
            -o /tmp/session-label-tests
          /tmp/session-label-tests

      - name: Build universal binary
        run: ./scripts/build-universal.sh dist

      - name: Smoke test
        run: |
          ./dist/findphone --help
          ./dist/findphone --list

      - name: Reject invalid usage
        run: |
          if ./dist/findphone --bogus >/dev/null 2>&1; then
            echo "expected a non-zero exit for an unknown flag"; exit 1
          fi
          ./dist/findphone --bogus 2>&1 | grep -q "unknown option '--bogus'"
          ./dist/findphone one two 2>&1 | grep -q "expected one device name"
          ./dist/findphone --sound 2>&1 | grep -q "needs a device name"
          test -z "$(./dist/findphone --bogus 2>/dev/null)"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: findphone-macos-universal
          path: dist/findphone
          if-no-files-found: error
